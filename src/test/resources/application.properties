# Test configuration: in-memory H2 (PostgreSQL mode), so tests need no database or env vars
spring.datasource.url=jdbc:h2:mem:forex;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

jwt.secret=test-secret-key-that-is-at-least-32-bytes-long!!
jwt.expiration-ms=3600000

app.cors.allowed-origins=http://localhost:5173

# Deterministic offline rates: tests never call the real API
app.rates.provider=fixed
