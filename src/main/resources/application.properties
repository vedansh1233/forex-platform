spring.application.name=forex-platform
server.port=${PORT:8080}

# --- Database (PostgreSQL) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/forex}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it matches the entities
spring.jpa.hibernate.ddl-auto=validate
# Databases created before Flyway (by ddl-auto=update) get V1 applied idempotently
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
# Write BigDecimal as 0.00000123, never 1.23E-6
spring.jackson.generator.write-bigdecimal-as-plain=true

# --- JWT ---
# Must be at least 32 bytes (HS256)
jwt.secret=${JWT_SECRET}
# Token lifetime in ms (default 10 hours)
jwt.expiration-ms=${JWT_EXPIRATION_MS:36000000}

# --- CORS: comma-separated frontend origins allowed to call the API ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# --- Exchange rates ---
# "frankfurter" = live ECB reference rates (free, no key); "fixed" = offline deterministic rates
app.rates.provider=${RATES_PROVIDER:frankfurter}
app.rates.frankfurter-url=https://api.frankfurter.dev/v1
# If the live source is down and nothing is cached, serve rates labelled source=SIMULATED instead of a 503
app.rates.fallback-to-simulated=${RATES_FALLBACK_TO_SIMULATED:true}

# --- Actuator: expose only health ---
management.endpoints.web.exposure.include=health

# --- Swagger / OpenAPI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true

# Optional local overrides (gitignored), e.g. DB password and JWT secret for development
spring.config.import=optional:file:./application-local.properties

# --- Crypto prices ---
# "coinbase" = live prices from Coinbase Exchange public market data (free, no key); "simulated" = offline
app.crypto.provider=${CRYPTO_PROVIDER:coinbase}
app.crypto.coinbase-url=https://api.exchange.coinbase.com
# How often live prices are refreshed and pushed to WebSocket clients
app.crypto.refresh-ms=${CRYPTO_REFRESH_MS:5000}

# --- Background jobs: crypto refresh, limit-order matching, price alerts ---
app.scheduling.enabled=${SCHEDULING_ENABLED:true}
app.orders.match-ms=${ORDERS_MATCH_MS:10000}
