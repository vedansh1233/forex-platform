spring.application.name=forex-platform
server.port=${PORT:8080}

# --- Database (PostgreSQL) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/forex}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
# Must be at least 32 bytes (HS256)
jwt.secret=${JWT_SECRET}
# Token lifetime in ms (default 10 hours)
jwt.expiration-ms=${JWT_EXPIRATION_MS:36000000}

# --- CORS: comma-separated frontend origins allowed to call the API ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# --- Actuator: expose only health ---
management.endpoints.web.exposure.include=health

# --- Swagger / OpenAPI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true

# Optional local overrides (gitignored), e.g. DB password and JWT secret for development
spring.config.import=optional:file:./application-local.properties
